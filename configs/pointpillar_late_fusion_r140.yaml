# PointPillars late-fusion detector at the FULL +/-140.8 m range, for OUR
# OPV2V data/pipeline.
#
# Why this file exists. Our existing detector (models/pointpillar_late_fusion/
# config.yaml, OpenCOOD's stock published checkpoint) runs at +/-70.4 m in x,
# but OpenCOOD's own evaluated GT_RANGE (opencood.data_utils.datasets.GT_RANGE)
# is +/-140 m for every published row, including every number this project has
# measured so far AND Chenyi's own reported OPV2V numbers (which he measured
# with a detector trained at this same +/-140.8 m range -- see his own
# configs/alignformer_detector_r140.yaml, fetched read-only via
# `git show origin/alignformer:configs/alignformer_detector_r140.yaml` from
# the labmate's repo, embedding-aware-BELT-fusion). His own config's comment:
# "416 of 4152 sampled ground-truth boxes (10.0%) lie beyond |x| = 70.4 m and
# are invisible to the narrow detector, capping its recall near 90% in every
# published row." This config is the same architecture at the range the
# evaluation actually uses.
#
# This is a line-for-line copy of OpenCOOD's own stock
# external/OpenCOOD/opencood/hypes_yaml/point_pillar_late_fusion.yaml, with
# ONLY cav_lidar_range (and root_dir/validate_dir, which the stock file
# leaves as placeholders) changed -- same discipline as Chenyi's own r140
# config, which changes nothing else either. The +/-70.4 m stock checkpoint
# (models/pointpillar_late_fusion/) is KEPT, not replaced: the comparison
# between the two ranges is itself the point of this exercise.
#
# Trained from scratch with OpenCOOD's own standard entrypoint, no shim:
#   python -u external/OpenCOOD/opencood/tools/train.py \
#     --hypes_yaml configs/pointpillar_late_fusion_r140.yaml
#
# Chenyi's own training wrapper (scripts/train_late_fusion.py on his branch)
# exists only to work around a machine-specific bottleneck (ASCII .pcd
# decoding on a slow USB disk on his machine). Timed directly on this
# machine before committing to a long run: our OPV2V tree
# (/mnt/external/workspace/public/dataset/opv2v) is also ASCII .pcd on a
# rotational disk, but our own existing cache-building pipeline
# (src/embedding_aware_belt_fusion/data/extract_proposals.py) already ran a
# full detector-inference pass over all 6374 OPV2V train frames (~16.4k
# agent-frames) in 1h43m without any shim -- "reasonable", not a
# multi-day bottleneck -- so this uses OpenCOOD's stock train.py directly.

name: point_pillar_late_fusion_r140
root_dir: "/mnt/external/workspace/public/dataset/opv2v/train"
validate_dir: "/mnt/external/workspace/public/dataset/opv2v/test"

yaml_parser: "load_point_pillar_params"
train_params:
  batch_size: &batch_size 2
  epoches: 15
  eval_freq: 1
  save_freq: 1

fusion:
  core_method: 'LateFusionDataset' # LateFusionDataset, EarlyFusionDataset, IntermediateFusionDataset supported
  args: []

# preprocess-related
preprocess:
  # options: BasePreprocessor, VoxelPreprocessor, BevPreprocessor
  core_method: 'SpVoxelPreprocessor'
  args:
    voxel_size: &voxel_size [0.4, 0.4, 4]
    max_points_per_voxel: 32
    max_voxel_train: 16000
    max_voxel_test: 40000
  # lidar range for each individual cav. CHANGED from stock +/-70.4 to +/-140.8.
  cav_lidar_range: &cav_lidar [-140.8, -40, -3, 140.8, 40, 1]

data_augment:
  - NAME: random_world_flip
    ALONG_AXIS_LIST: [ 'x' ]

  - NAME: random_world_rotation
    WORLD_ROT_ANGLE: [ -0.78539816, 0.78539816 ]

  - NAME: random_world_scaling
    WORLD_SCALE_RANGE: [ 0.95, 1.05 ]

# anchor box related
postprocess:
  core_method: 'VoxelPostprocessor' # VoxelPostprocessor, BevPostprocessor supported
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 3.9
    w: 1.6
    h: 1.56
    r: [0, 90]
    num: &achor_num 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.20
  order: 'hwl' # hwl or lwh
  max_num: 100 # maximum number of objects in a single frame. use this number to make sure different frames has the same dimension in the same batch
  nms_thresh: 0.15

# model related
model:
  core_method: point_pillar
  args:
    voxel_size: *voxel_size
    lidar_range: *cav_lidar
    anchor_number: *achor_num
    pillar_vfe:
      use_norm: true
      with_distance: false
      use_absolute_xyz: true
      num_filters: [64]
    point_pillar_scatter:
      num_features: 64

    base_bev_backbone:
      layer_nums: [3, 5, 8]
      layer_strides: [2, 2, 2]
      num_filters: [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]

    anchor_num: *achor_num

loss:
  core_method: point_pillar_loss
  args:
    cls_weight: 1.0
    reg: 2.0

optimizer:
  core_method: Adam
  lr: 0.002
  args:
    eps: 1e-10
    weight_decay: 1e-4

lr_scheduler:
  core_method: multistep #step, multistep and Exponential support
  gamma: 0.1
  step_size: [10, 15]
